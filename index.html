<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Python Code Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Pyodide for running Python in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 mt-6">
        <h1 class="text-2xl font-bold mb-2 flex items-center gap-2 text-indigo-400">
            🤖 AI Python Code Generator
        </h1>
        <p class="text-gray-400 text-sm mb-6">Enter your Gemini API key and what you want to build, and AI will write the Python code for you!</p>

        <!-- API Key Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-300 mb-1">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Prompt Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-300 mb-1">What do you want to build?</label>
            <textarea id="userPrompt" rows="4" placeholder="e.g., A Python script that calculates prime numbers or a text-based calculator" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <!-- Generate Button -->
        <button onclick="generateCode()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200">
            🚀 Generate Code
        </button>

        <!-- Loading Spinner -->
        <div id="loader" class="hidden text-center my-4 text-indigo-400 animate-pulse">
            🤖 Generating your code... Please wait...
        </div>

        <!-- Output Section -->
        <div id="outputSection" class="hidden mt-6">
            <h2 class="text-lg font-semibold mb-2 text-indigo-300">📝 Generated Code:</h2>
            <pre class="bg-gray-950 p-4 rounded-lg overflow-x-auto border border-gray-800 text-sm"><code id="codeOutput" class="language-python"></code></pre>

            <!-- Action Buttons -->
            <div class="flex gap-3 mt-4">
                <button onclick="copyCode()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-medium py-2 rounded-lg text-sm transition">
                    📋 Copy Code
                </button>
                <button onclick="runCode()" id="runBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-sm transition">
                    ▶️ Run Code (In Browser)
                </button>
            </div>

            <!-- Console Output -->
            <div id="consoleSection" class="hidden mt-4">
                <h3 class="text-sm font-semibold mb-1 text-gray-400">💻 Console Output:</h3>
                <pre id="consoleOutput" class="bg-black text-emerald-400 p-3 rounded-lg text-xs font-mono h-32 overflow-y-auto border border-gray-800"></pre>
            </div>
        </div>
    </div>

    <script>
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
            } catch (e) {
                console.error("Pyodide load failed", e);
            }
        }
        initPyodide();

        async function generateCode() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('userPrompt').value.trim();
            const loader = document.getElementById('loader');
            const outputSection = document.getElementById('outputSection');
            const codeOutput = document.getElementById('codeOutput');

            if (!apiKey) {
                alert('Please enter your Gemini API key!');
                return;
            }
            if (!prompt) {
                alert('Please enter a prompt!');
                return;
            }

            loader.classList.remove('hidden');
            outputSection.classList.add('hidden');

            const systemInstruction = "You are an expert Python software engineer. Write clean, efficient, well-commented Python code based strictly on the user's prompt. Output ONLY valid Python code without markdown code blocks like ```python.";
            
            try {
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { temperature: 0.2 }
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let codeText = data.candidates[0].content.parts[0].text.trim();

                if (codeText.startsWith("```python")) codeText = codeText.slice(9);
                if (codeText.startsWith("```")) codeText = codeText.slice(3);
                if (codeText.endswith("```")) codeText = codeText.slice(0, -3);
                codeText = codeText.trim();

                codeOutput.textContent = codeText;
                hljs.highlightElement(codeOutput);
                outputSection.classList.remove('hidden');
                document.getElementById('consoleSection').classList.add('hidden');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                loader.classList.add('hidden');
            }
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code);
            alert('Code copied to clipboard!');
        }

        async function runCode() {
            const consoleSection = document.getElementById('consoleSection');
            const consoleOutput = document.getElementById('consoleOutput');
            const code = document.getElementById('codeOutput').textContent;

            consoleSection.classList.remove('hidden');
            consoleOutput.textContent = "Loading Python environment...\n";

            if (!pyodideReady) {
                consoleOutput.textContent += "Please wait for Pyodide to finish loading...\n";
                return;
            }

            try {
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                await pyodideInstance.runPythonAsync(code);

                const stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                consoleOutput.textContent = stdout || "Code executed successfully with no output.";
            } catch (err) {
                consoleOutput.textContent = "Error:\n" + err;
            }
        }
    </script>
</body>
</html>
